services:
  - type: web
    name: dfa-mail-server
    runtime: docker
    rootDir: mail-server
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: SESSION_SECRET
        generateValue: false
        sync: false
      - key: ALLOWED_ORIGIN
        value: https://mail.dfalog.com.br,https://id-preview--10b0fef0-3eb4-48ad-91ea-02fadbc8328e.lovable.app
      - key: ALLOWED_DOMAINS
        value: dfalog.com.br
